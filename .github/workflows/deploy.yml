name: Deploy to Cloud Run

# Auto-deploys the Hub app to Cloud Run on merge to master.
# Mirrors deploy.ps1 (project rxfit-automation, service "hub", region us-central1).
#
# ── One-time setup (required before this runs) ────────────────────────────────
# Add ONE repository secret with a GCP service-account key JSON:
#   Settings → Secrets and variables → Actions → New repository secret
#     Name:  GCP_SA_KEY
#     Value: <contents of the service-account key .json>
#
# The service account needs these roles on project rxfit-automation:
#   roles/run.admin               (deploy Cloud Run services)
#   roles/iam.serviceAccountUser  (act as the runtime SA)
#   roles/cloudbuild.builds.editor(build the container from source)
#   roles/artifactregistry.writer (push the built image)
#   roles/storage.admin           (Cloud Build staging bucket)
#
# More secure alternative (recommended long-term): Workload Identity Federation.
# Swap the "Authenticate" step's `credentials_json` for:
#     workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
#     service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
# and remove GCP_SA_KEY.
#
# App secrets (DB URL, API keys, OAuth, etc.) are NOT set here — they are already
# attached to the Cloud Run service via Secret Manager (secretKeyRef) and persist
# across `gcloud run deploy --source` deploys. Only non-secret config is set below.

on:
  # Deploy ONLY after the "CI" workflow (ci.yml) completes SUCCESSFULLY on
  # master. Previously this triggered on `push: master` independently of CI, so
  # a red typecheck/lint/unit/e2e run could still ship. Now the deploy job's
  # `if:` below requires `conclusion == 'success'` — a failed or cancelled CI
  # can no longer deploy. workflow_run cannot filter by path, so every
  # successful master CI run is eligible; the job checks out the exact commit CI
  # validated (workflow_run.head_sha), not just the branch tip.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# Never run two deploys of the same service at once; let an in-flight deploy finish.
concurrency:
  group: deploy-hub
  cancel-in-progress: false

env:
  GCP_PROJECT: rxfit-automation
  REGION: us-central1
  SERVICE: hub

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    # Gate: run ONLY when the triggering CI run succeeded (workflow_run) or on a
    # manual dispatch. This is what blocks a red CI from deploying.
    #
    # SECURITY: the workflow_run path additionally requires the CI run to have
    # been a `push` on THIS repo. Without these clauses, a fork PR from a branch
    # literally named "master" spoofs the `on.workflow_run.branches: [master]`
    # filter — since ci.yml runs `on: pull_request`, the fork's CI completion
    # would trigger this deploy, checking out the attacker's head_sha and running
    # `gcloud run deploy` with secrets.GCP_SA_KEY (classic workflow_run
    # untrusted-checkout). event=='push' + head_repository==this-repo close it.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    permissions:
      contents: read
      id-token: write   # needed if you switch to Workload Identity Federation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deploy the EXACT commit CI validated (workflow_run.head_sha); fall
          # back to the dispatch ref for manual runs.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          # Non-secret config — kept in sync with deploy.ps1 $ENV_VARS
          ENV_VARS="ADMIN_TEAM=Danny Trejo"
          ENV_VARS="$ENV_VARS,DEFAULT_PAPERCLIP_COMPANY_ID=8f2acc3d-f2dc-4f8c-897e-7c400e91fd85"
          ENV_VARS="$ENV_VARS,NEXTAUTH_URL=https://hub.casatrejo.com"
          ENV_VARS="$ENV_VARS,NODE_ENV=production"
          ENV_VARS="$ENV_VARS,PAPERCLIP_BASE_URL=https://rxfit-paperclip-11747747730.us-central1.run.app"
          ENV_VARS="$ENV_VARS,SUPERADMIN_EMAILS=danny@rxfitatx.com"
          # Individually-invited guests on consumer domains (see lib/auth.ts).
          ENV_VARS="$ENV_VARS,ALLOWED_EMAIL_ADDRESSES=caroljean37@gmail.com"
          # Display-name corrections (email:Name pairs — see lib/auth.ts).
          ENV_VARS="$ENV_VARS,USER_DISPLAY_NAME_OVERRIDES=caroljean37@gmail.com:Carol-Jean"
          ENV_VARS="$ENV_VARS,VERTEX_ENGINE_ID=semanticbrain_1779229063037"
          ENV_VARS="$ENV_VARS,VERTEX_GCP_PROJECT=semantic-brain-desktop"

          # --add-cloudsql-instances pins the documented DB attachment
          # (service.yaml / scripts/gcp-migrate-hub.ps1) on EVERY deploy.
          # Idempotent when already attached; restores it if any past deploy
          # dropped it. The smoke test's healthz db:false (2026-07-11/12) means
          # fresh revisions can't reach Postgres — a missing Cloud SQL socket
          # attachment is the most likely cause, and this makes it impossible.
          #
          # --min-instances=1 keeps ONE instance warm so a cold Cloud SQL socket
          # connect can't race the healthz DB timeout and degrade the first user
          # sessions after a deploy (user-facing service). Was 0; matches
          # service.yaml's autoscaling.knative.dev/minScale: '1'.
          #
          # BLUE-GREEN TRAFFIC GATE (--no-traffic + --tag=candidate): the new
          # revision is deployed with 0% traffic under the `candidate` tag. The
          # existing (last-good) revision keeps serving 100% of users while we
          # validate the candidate's /api/healthz below; traffic is promoted to
          # the candidate ONLY after the smoke test passes (next steps). So a
          # revision that can't reach Postgres never takes a single user request —
          # true zero-downtime, fail-closed. This is the structural fix for the
          # prior multi-day outage where `gcloud run deploy` shifted 100% traffic
          # to a DB-unreachable revision the instant it deployed, with no rollback.
          # (service.yaml's startupProbe is reference-only — `--source` deploys
          # ignore it — and `gcloud run deploy` has no HTTP-startup-probe flag, so
          # a canary tag + validate + promote is the correct gate.)
          gcloud run deploy "$SERVICE" \
            --source ./hub \
            --project="$GCP_PROJECT" \
            --region="$REGION" \
            --allow-unauthenticated \
            --no-traffic \
            --tag=candidate \
            --memory=1Gi \
            --timeout=120 \
            --min-instances=1 \
            --max-instances=3 \
            --add-cloudsql-instances="$GCP_PROJECT:$REGION:hub-pg" \
            --update-env-vars="$ENV_VARS"

      - name: Smoke test
        run: |
          set -euo pipefail
          # Validate the CANDIDATE revision, NOT status.url. status.url is the
          # currently-serving (old, last-good) revision — it still has 100% of
          # traffic and would trivially pass, telling us nothing about the new
          # revision. The candidate was deployed --no-traffic under the
          # `candidate` tag, which mints its own stable URL in the traffic list;
          # resolve that tagged URL and probe it directly. jq is preinstalled on
          # ubuntu-latest.
          CANDIDATE_URL=$(gcloud run services describe "$SERVICE" \
            --project="$GCP_PROJECT" --region="$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          if [ -z "$CANDIDATE_URL" ] || [ "$CANDIDATE_URL" = "null" ]; then
            echo "::error::Could not resolve the candidate tag URL — cannot validate the new revision before promoting."
            exit 1
          fi
          echo "Candidate URL: $CANDIDATE_URL"

          # Informational only: the root path 302s to /login (auth wall) and
          # never touches AI/DB — kept purely as an "is the socket up" signal.
          ROOT=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$CANDIDATE_URL" || echo 000)
          echo "GET /            -> HTTP $ROOT"

          # GATING assertion: /api/healthz returns 200 ONLY when the DB answers
          # SELECT 1 AND at least one AI provider key is present. A 503 means the
          # revision is up but NOT serviceable (missing AI key / DB down) — fail
          # the deploy so a broken revision does not stay live. (The old check
          # curled `/` and accepted any non-5xx, which 302s to /login and never
          # exercises AI or the DB — it would pass an AI-provider outage.)
          #
          # RETRY over ~40s before failing: the probe runs seconds after traffic
          # routing, and healthz bounds its DB check at 5s — a cold instance's
          # FIRST-ever Cloud SQL socket connect could still lose that race, which
          # made every smoke test report db:false against a revision whose DB is
          # fine once warm (2026-07-11/12). A persistent DB outage still fails
          # all attempts.
          CODE=000
          for attempt in 1 2 3 4 5 6 7 8; do
            CODE=$(curl -s -o /tmp/healthz.json -w '%{http_code}' --max-time 30 "$CANDIDATE_URL/api/healthz" || echo 000)
            echo "GET /api/healthz (attempt $attempt) -> HTTP $CODE  body: $(cat /tmp/healthz.json 2>/dev/null || true)"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          if [ "$CODE" != "200" ]; then
            echo "::error::Smoke test failed — /api/healthz returned $CODE after 8 attempts (expected 200). Revision is not serviceable."
            exit 1
          fi
          echo "Smoke test passed — /api/healthz == 200."

      # Promote the just-validated candidate to 100% traffic. `--to-latest`
      # shifts all traffic to the latest revision (the candidate we deployed and
      # smoke-tested above). This step runs ONLY if the smoke test passed — a
      # failed earlier step short-circuits the job (GitHub skips later steps
      # without an explicit `if:`), so on smoke failure this is SKIPPED and the
      # last-good revision keeps serving 100% of users. That is the fail-closed,
      # zero-downtime guarantee: users only ever move to a revision proven to
      # reach Postgres and hold an AI key.
      - name: Promote candidate to 100% traffic
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" \
            --project="$GCP_PROJECT" --region="$REGION" \
            --to-latest
          echo "Promoted candidate revision to 100% traffic."
          # Best-effort tag cleanup — a leftover 'candidate' tag is harmless
          # (an extra URL onto the now-live revision), so never fail on it.
          gcloud run services update-traffic "$SERVICE" \
            --project="$GCP_PROJECT" --region="$REGION" \
            --remove-tags=candidate || echo "::warning::could not remove candidate tag (non-fatal)."

      # NON-GATING custom-domain check. hub.casatrejo.com is the URL real users
      # hit; the gating smoke test above only proves the .run.app revision is
      # healthy, NOT that the custom domain resolves to it. This surfaces a stale
      # Cloud Run domain-mapping / DNS / Cloudflare-cache mismatch as a WARNING
      # without failing the deploy.
      #
      # WHY warning-only (never ::error::, never exit 1): hub.casatrejo.com sits
      # behind Cloudflare, which 403s / issues a JS challenge to non-browser
      # clients like this CI curl even when the app is perfectly healthy. A hard
      # gate here would brick EVERY deploy on a CDN artifact — the exact
      # false-failure class behind the 3-day outage. The .run.app healthz above
      # stays the REAL gate; this step is advisory signal only.
      - name: Custom-domain smoke test (non-gating)
        run: |
          set +e   # override GitHub's default `bash -eo pipefail`: a non-zero
                   # curl or a non-200 body must NEVER fail this advisory step.
          DOMAIN_URL="https://hub.casatrejo.com/api/healthz"
          CODE=$(curl -sL -o /tmp/dom.json -w '%{http_code}' --max-time 20 "$DOMAIN_URL" || true)
          [ -z "$CODE" ] && CODE=000
          BODY=$(head -c 300 /tmp/dom.json 2>/dev/null | tr -d '\n\r' || true)
          echo "GET $DOMAIN_URL -> HTTP $CODE"
          echo "body: $BODY"
          if [ "$CODE" = "200" ]; then
            echo "✓ custom domain serves a healthy revision"
          else
            echo "::warning::custom domain hub.casatrejo.com returned HTTP $CODE from /api/healthz — the .run.app revision is healthy but the domain may be pointing at a stale target (verify the Cloud Run domain-mapping + DNS; a Cloudflare orange-cloud proxy can cache/challenge). Users may be hitting a broken deploy."
          fi

      # On failure, surface the revision's own startup diagnostics in the
      # Actions log. The container entrypoint logs "[migrate]"/"[entrypoint]"
      # lines including the exact Postgres error code (ENOENT missing socket,
      # ECONNREFUSED, 28P01 bad password, …) on every cold start — this step
      # saves a trip to the Cloud Logging console when the smoke test fails.
      # NOTE: order must stay desc (the default) — gcloud only applies
      # --freshness with descending order, so asc walks from the 30-day
      # retention boundary and returns month-old junk (observed 2026-07-12).
      # `tac` restores chronological order for reading.
      - name: Dump revision startup logs (on failure)
        if: failure()
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="hub" AND (textPayload:"[migrate]" OR textPayload:"[entrypoint]")' \
            --project="$GCP_PROJECT" --freshness=30m --limit=80 \
            --format='value(timestamp,resource.labels.revision_name,textPayload)' \
            | tac \
            || echo "::warning::Could not read revision logs — deploy SA likely needs roles/logging.viewer."
