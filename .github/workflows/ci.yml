name: CI

# Typecheck + lint + unit/stress tests + Playwright e2e on every PR and on
# pushes to master. The Next.js app and its suites live in the hub/ subdirectory.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    # Ephemeral, test-scoped Postgres for DB-backed route/repository tests
    # (NS-3). pgvector image so drizzle/migrate.mjs' `CREATE EXTENSION vector`
    # succeeds. This is a throwaway service container — NEVER a real/prod DB.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hub_test
        ports:
          - 5432:5432
        # Health-wait so tests never race a not-yet-ready DB (no flakiness).
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Runs the full unit suite WITH v8 coverage and the DB harness. The
      # coverage thresholds in vitest.config.ts act as a ratchet: CI fails if
      # coverage drops below the committed baseline. DATABASE_URL points at the
      # ephemeral service so the DB-backed suite (tests/settings-kpis-db.test.ts)
      # runs here; locally, without a DB, that suite skips and `npm test` stays
      # green. The text summary is emitted to the job log.
      - name: Test (coverage + DB harness)
        run: npm run test:coverage
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hub_test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts boots `next dev -p 3100` with a throwaway
      # NEXTAUTH_SECRET; tests mint a real session cookie and mock /api/* in
      # the browser, so no external credentials are needed.
      - name: Run e2e tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: hub/playwright-report/
          retention-days: 14
